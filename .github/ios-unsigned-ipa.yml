```yaml
name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Make build script executable
        run: chmod +x build_unsigned.sh build_esign_ready_ipa.sh

      - name: Build unsigned IPA
        run: ./build_unsigned.sh

      - name: Verify eSign-ready package
        run: |
          ./build_esign_ready_ipa.sh \
            build/HYper-Regedit-Key-Enabled-unsigned.ipa

      - name: Check generated IPA
        run: |
          ls -lh build/
          test -f build/HYper-Regedit-Key-Enabled-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: HYper-Regedit-Key-Enabled-unsigned-ipa
          path: build/HYper-Regedit-Key-Enabled-unsigned.ipa
          if-no-files-found: error
```
